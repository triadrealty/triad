<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="#000000">
  <!-- Triad Realty architectural mark: two groups of vertical pillars (left taller group + right shorter group) -->
  <!-- Left group: 5 tall pillars tapering to fine points at top -->
  <rect x="12" y="8" width="3" height="62" rx="1"/>
  <rect x="18" y="12" width="3" height="58" rx="1"/>
  <rect x="24" y="16" width="3" height="54" rx="1"/>
  <rect x="30" y="20" width="3" height="50" rx="1"/>
  <rect x="36" y="24" width="3" height="46" rx="1"/>
  <!-- Right group: 5 shorter pillars -->
  <rect x="52" y="30" width="3" height="40" rx="1"/>
  <rect x="58" y="34" width="3" height="36" rx="1"/>
  <rect x="64" y="38" width="3" height="32" rx="1"/>
  <rect x="70" y="42" width="3" height="28" rx="1"/>
  <rect x="76" y="46" width="3" height="24" rx="1"/>
  <!-- Base lines connecting pillars -->
  <rect x="12" y="70" width="27" height="4" rx="1"/>
  <rect x="52" y="70" width="27" height="4" rx="1"/>
</svg>
