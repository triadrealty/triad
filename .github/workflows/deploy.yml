name: Deploy to Render

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger Render deploy hook
        run: |
          if [ -n "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "Triggering Render deploy hook..."
            curl -f -X POST "${RENDER_DEPLOY_HOOK_URL}" \
              -H "Accept: application/json" \
              --silent --show-error
            echo "Render deploy hook triggered successfully!"
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not provided."
            echo "If your Render Web Service is connected to this repository (triadrealty/triad),"
            echo "Render will automatically build and deploy this commit via native GitHub integration."
          fi
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
